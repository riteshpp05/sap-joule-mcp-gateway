---
applications:
  - name: abap-cds-agent-backend
    memory: 1024M
    disk_quota: 1024M
    buildpacks:
      - python_buildpack
    command: uvicorn server:app --host 0.0.0.0 --port $PORT
    random-route: true
    health-check-type: http
    health-check-http-endpoint: /health
    env:
      PYTHONVERSION: 3.10.12
