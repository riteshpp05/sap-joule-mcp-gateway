name: Enterprise Gateway CI & Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-package:
    name: Build, Test & Validate Joule Package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Production Test Suite (18 Test Cases)
        env:
          SAP_MOCK_MODE: "true"
        run: |
          python test_suite.py

      - name: Validate SAP Joule Manifest & Build Tenant Archive
        run: |
          python deploy.py --package

      - name: Upload Joule Agent Deployment Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sap-joule-agent-package
          path: abap_cds_agent.zip
          retention-days: 7
